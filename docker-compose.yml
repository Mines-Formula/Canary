services:
  heartbeat:
    build: .
    image: fsae-canary:latest
    profiles: [ "server" ]
    environment:
      API_KEY: ${API_KEY:-}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  emitter:
    build: .
    image: fsae-canary:latest
    profiles: [ "emitter" ]
    command: [ "python", "emitter.py" ]
    restart: unless-stopped
    network_mode: host
    volumes:
      - /:/host:ro
      - type: bind
        source: ./services.toml
        target: /app/services.toml
        read_only: true
        bind:
          create_host_path: false
    environment:
      API_KEY: ${API_KEY:-}
      CANARY_URL: ${CANARY_URL:-}
      SERVICE_NAME: ${SERVICE_NAME:-fsaelinux}
      PING_INTERVAL: ${PING_INTERVAL:-10}
      CANARY_SERVICES_FILE: /app/services.toml

  canary:
    build: .
    image: fsae-canary:latest
    profiles: [ "server" ]
    command: [ "python", "-m", "canary" ]
    depends_on:
      - heartbeat
    environment:
      SLACK_ADMIN_USER_TOKEN: ${SLACK_ADMIN_USER_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      CANARY_STATUS_URL: ${CANARY_STATUS_URL:-http://heartbeat:8000/status}
      CANARY_HOST_SERVICE: ${CANARY_HOST_SERVICE:-fsaelinux}
      CANARY_SERVICES_FILE: /app/services.toml
      CANARY_POLL_INTERVAL: ${CANARY_POLL_INTERVAL:-10}
      CANARY_CONFIRMATION_SECONDS: ${CANARY_CONFIRMATION_SECONDS:-60}
      CANARY_REMINDER_SECONDS: ${CANARY_REMINDER_SECONDS:-3600}
      CANARY_DISK_THRESHOLD: ${CANARY_DISK_THRESHOLD:-90}
      CANARY_DISK_CLEAR: ${CANARY_DISK_CLEAR:-85}
      CANARY_DB_PATH: /app/data/canary.sqlite3
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - canary-data:/app/data
      - type: bind
        source: ./services.toml
        target: /app/services.toml
        read_only: true
        bind:
          create_host_path: false

volumes:
  canary-data:
