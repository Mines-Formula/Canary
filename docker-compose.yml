services:
  heartbeat:
    build: .
    image: fsae-canary:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  emitter:
    image: fsae-canary:latest
    command: [ "python", "emitter.py" ]
    restart: unless-stopped
    network_mode: host
    volumes:
      - /:/host:ro
    env_file:
      - .env
