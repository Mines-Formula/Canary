services:
  heartbeat:
    build: .
    image: fsae-canary:latest
    profiles: [ "server" ]
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  emitter:
    build: .
    image: fsae-canary:latest
    profiles: [ "emitter" ]
    command: [ "python", "emitter.py" ]
    restart: unless-stopped
    environment:
      - CANARY_URL=http://54.196.50.201:8000/heartbeat
      - SERVICE_NAME=fsaelinux
      - PING_INTERVAL=10
